version: 2

updates:
  # NuGet packages. Package versions are managed centrally in
  # Source/Directory.Packages.props, so Dependabot scans that directory.
  - package-ecosystem: "nuget"
    directory: "/Source"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Copenhagen"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "nuget"
    # Only minor and patch updates are automated; major bumps are done by hand.
    #
    # `ignore` is what enforces this. It is applied while Dependabot resolves
    # candidate versions, so a major release is never considered at all -
    # neither for a grouped PR nor for an individual one.
    #
    # Do not express this with `allow` + `update-types` (or with `update-types`
    # on groups). Both read as "minor and patch only", but neither is enforced
    # on the grouped-update path: Dependabot parses the rule into
    # `allowed-updates`, then ignores it and still bumps to the next major
    # version. `ignore` is applied per dependency and is independent of how
    # updates are grouped, so it keeps working whatever the groups look like.
    #
    # Caveat: this also suppresses *security* updates that would need a major
    # bump. Advisories are still reported on the Dependabot alerts page, so
    # those can be handled manually if it ever matters.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      # Keep the Microsoft.Extensions.* packages in a single PR so their
      # versions stay in sync.
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      # Group test and coverage tooling updates together.
      test-tooling:
        patterns:
          - "xunit*"
          - "Microsoft.Testing.Extensions.CodeCoverage"
          - "Moq"
          - "coverlet*"
          - "altcover"
      # Everything else: one PR for the remaining updates.
      minor-and-patch:
        patterns:
          - "*"

  # GitHub Actions used in .github/workflows, including the shared-pipelines
  # reusable workflows and the publish-nuget composite action.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Copenhagen"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    # Same rule as NuGet: no major action bumps.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      # One PR for all action/workflow version updates.
      github-actions:
        patterns:
          - "*"
