name: Release nuget package

on:
  workflow_dispatch:

jobs:
  # Build, test and pack with the shared pipeline. Publishing to nuget.org is
  # disabled here because NuGet/login must run in this repository's workflow
  # file for the OIDC token to match the nuget.org Trusted Publishing policy.
  release:
    permissions:
      contents: read
      packages: write
    uses: bjornbouetsmith/shared-pipelines/.github/workflows/release-nuget.yml@v1.4.0
    with:
      solution: Source/ETCDConfiguration.sln
      allowed-actors: bjornbouetsmith
      publish-nuget-org: false
      test-args: '--filter "Category!=Integration"'

  publish-nuget-org:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: bjornbouetsmith/shared-pipelines/.github/actions/publish-nuget@v1.4.0
        with:
          artifact-name: nuget-packages
          user: bjornbouetsmith
