name: Release nuget package

on:
  workflow_dispatch:
jobs:
  release:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: bjornbouetsmith/shared-pipelines/.github/workflows/release-nuget.yml@v1.3.0
    with:
      solution: Source/ETCDConfiguration.sln
      allowed-actors: bjornbouetsmith
      publish-nuget-org: true
      nuget-org-user: bjornbouetsmith
