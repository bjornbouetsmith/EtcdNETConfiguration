name: Increment Version and Tag Release

on:
  workflow_dispatch:
    inputs:
      version_part:
        type: choice
        options: [ Patch, Minor, Major ]
        default: Patch
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: bjornbouetsmith/shared-pipelines/.github/workflows/increment-version.yml@v1.3.3
    with:
      solution: Source/ETCDConfiguration.sln
      version-part: ${{ inputs.version_part || 'patch' }}
      version-file: Source/Directory.Build.props
    secrets: inherit