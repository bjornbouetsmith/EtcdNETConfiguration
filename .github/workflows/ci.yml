name: Build and Test

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '.github/**'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  # Required so the shared pipeline can publish the Sonar quality gate status.
  statuses: write

jobs:
  build-and-test:
#    uses: bjornbouetsmith/shared-pipelines/.github/workflows/dotnet-docker-ci-build.yml@v1.3.0
    uses: bjornbouetsmith/shared-pipelines/.github/workflows/dotnet-docker-ci-build.yml@users/bbs/update_test_action
    with:
      working-directory: Source
      solution: ETCDConfiguration.sln

      # Start the repository's Docker Compose stack and wait for etcd.
      docker-compose-files: docker-compose.yml
      wait-for-urls: http://127.0.0.1:2379/health
      test-env: ETCD_ENDPOINT=http://127.0.0.1:2379

      # Run the tests with coverage and keep the results as an artifact.
      run-tests: true
      test-results-directory: TestResults
      upload-test-results: true
      artifact-name: test-results

      # SonarCloud analysis, coverage import and quality gate.
      sonar: true
      sonar-host-url: https://sonarcloud.io
      sonar-project-key: ROOT.Etcd.Configuration
      sonar-organization: bjornbouetsmith
      sonar-coverage-reports: '**/coverage.opencover.xml'
      sonar-quality-gate-wait: true
      sonar-publish-status: true
    secrets:
      # The repository secret is named SONAR_TOKEN; the shared workflow expects
      # the sonar-token secret name.
      sonar-token: ${{ secrets.SONAR_TOKEN }}
