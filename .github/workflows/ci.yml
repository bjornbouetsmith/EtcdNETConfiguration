name: Build and Test

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '.github/**'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: read
  statuses: write

jobs:
  build-and-test:
    uses: bjornbouetsmith/shared-pipelines/.github/workflows/dotnet-docker-ci-build.yml@v1.5.0
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
    with:
      sonar: true
      sonar-project-key: ETCDConfiguration
      sonar-organization: bjornbouetsmith
      sonar-coverage-reports: '**/TestResults/**/*.xml'
      set-commit-status: true
      solution: Source/ETCDConfiguration.slnx
      docker-compose-files: Source/docker-compose.yml
      docker-compose-project-name: shared-pipelines-docker-${{ github.run_id }}
      wait-for-urls: http://127.0.0.1:2379/health
      wait-timeout-seconds: 120
      wait-interval-seconds: 2
      test-env: ETCD_ENDPOINT=http://127.0.0.1:2379
      upload-test-results: true
