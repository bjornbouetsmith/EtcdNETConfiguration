name: Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # GitHub starts this container before the job steps and publishes its
    # ports on the runner, so the tests can reach etcd via 127.0.0.1.
    services:
      etcd:
        image: quay.io/coreos/etcd:v3.6.5
        entrypoint: /usr/local/bin/etcd
        command: >-
          --name=etcd
          --data-dir=data.etcd
          --advertise-client-urls=http://etcd:2379
          --listen-client-urls=http://0.0.0.0:2379
          --initial-advertise-peer-urls=http://etcd:2380
          --listen-peer-urls=http://0.0.0.0:2380
          --initial-cluster=etcd=http://etcd:2380
          --initial-cluster-state=new
          --initial-cluster-token=etcd-cluster-1
        ports:
          - 2379:2379
          - 2380:2380

    env:
      # The tests use this endpoint instead of starting docker-compose.
      ETCD_ENDPOINT: http://127.0.0.1:2379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Source/ETCDConfiguration.sln

      - name: Build
        run: dotnet build Source/ETCDConfiguration.sln --configuration Release --no-restore

      - name: Wait for etcd
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "${ETCD_ENDPOINT}/health"; then
              echo "etcd is ready"
              exit 0
            fi
            echo "Waiting for etcd (attempt ${attempt}/30)..."
            sleep 2
          done

          echo "etcd did not become ready in time"
          exit 1

      - name: Test
        run: >
          dotnet test Source/ETCDConfiguration.sln
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      - name: Show etcd logs
        if: failure()
        run: docker logs "${{ job.services.etcd.id }}"
