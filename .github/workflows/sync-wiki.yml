name: Sync wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - '.github/workflows/sync-wiki.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Publish docs/wiki to GitHub Wiki
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate wiki token
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_SYNC_TOKEN }}
        run: |
          if [ -z "$WIKI_TOKEN" ]; then
            echo "::error title=Missing WIKI_SYNC_TOKEN::Create the WIKI_SYNC_TOKEN repository secret with permission to push to the wiki repository."
            exit 1
          fi

      - name: Clone wiki
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_SYNC_TOKEN }}
        run: |
          git clone "https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki

      - name: Mirror documentation into wiki
        run: |
          rsync -a --delete --exclude '.git' docs/wiki/ wiki/

      - name: Commit and push
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi

          git commit -m "docs: sync wiki from ${GITHUB_SHA:0:7}"
          git push origin HEAD
