version: '3.8'

# Use a distinct project name so this stack can run alongside the plaintext
# and server-auth-only TLS stacks.
name: etcd-mtls

# Mutual-TLS etcd instance used by the mTLS integration tests. The server
# requires every client to present a certificate signed by certs/ca.crt.
#
# Start it with:
#   docker compose -f docker-compose.mtls.yml up -d
#
# Certificates live in ./certs and are generated by ./certs/generate-certs.sh.
# They are self-signed test certificates - never use them in production.
services:
  etcd:
    image: quay.io/coreos/etcd:v3.6.5
    hostname: etcd
    command:
      - etcd
      - --name=etcd
      - --data-dir=data.etcd
      - --advertise-client-urls=https://etcd:2379
      - --listen-client-urls=https://0.0.0.0:2379
      - --cert-file=/certs/server.crt
      - --key-file=/certs/server.key
      - --client-cert-auth=true
      - --trusted-ca-file=/certs/ca.crt
      - --initial-advertise-peer-urls=http://etcd:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=etcd=http://etcd:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=etcd-cluster-mtls-1
    volumes:
      - etcd-mtls-vol:/data.etcd
      - ./certs:/certs:ro
    networks:
      - etcd
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "5"
    restart: always
    ports:
      # 12389 avoids clashing with the plaintext instance on 2379 and the
      # server-auth-only TLS instance on 12379.
      - "12389:2379"
      - "12390:2380"

volumes:
  etcd-mtls-vol:
    driver: local

networks:
  etcd:
    driver: bridge
