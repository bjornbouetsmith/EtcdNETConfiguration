version: '3.8'

# Use a distinct project name so this stack can run alongside docker-compose.yml.
name: etcd-tls

# TLS-enabled etcd instance used by the TLS integration tests.
#
# Start it with:
#   docker compose -f docker-compose.tls.yml up -d
#
# Certificates live in ./certs and are generated by ./certs/generate-certs.sh.
# They are self-signed test certificates - never use them in production.
# The TLS integration tests generate them automatically when missing or stale.
services:
  etcd:
    image: quay.io/coreos/etcd:v3.6.5
    hostname: etcd
    command:
      - etcd
      - --name=etcd
      - --data-dir=data.etcd
      - --advertise-client-urls=https://etcd:2379
      - --listen-client-urls=https://0.0.0.0:2379
      - --cert-file=/certs/server.crt
      - --key-file=/certs/server.key
      - --client-cert-auth=false
      - --initial-advertise-peer-urls=http://etcd:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=etcd=http://etcd:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=etcd-cluster-tls-1
    volumes:
      - etcd-tls-vol:/data.etcd
      - ./certs:/certs:ro
    networks:
      - etcd
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "5"
    restart: always
    ports:
      # 12379 avoids clashing with the plaintext instance on 2379, so both
      # compose files can run at the same time.
      - "12379:2379"
      - "12380:2380"

volumes:
  etcd-tls-vol:
    driver: local

networks:
  etcd:
    driver: bridge
